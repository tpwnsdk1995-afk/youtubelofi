# 파이프라인 전역 설정
video:
  # 목표 길이를 강제하지 않음 - music_library 전체 분량 + reuse_ratio만큼 재사용된 길이가 그대로 영상 길이가 됨.
  resolution: "1920x1080"
  fps: 2 # 정적 이미지 반복이라 낮은 fps로도 충분. 재생 호환성을 위해 최소 1 이상 유지.
  crf: 20
  preset: fast

audio:
  crossfade_seconds: 3
  # 라이브러리 곡 중 이 비율만큼 무작위로 한 번 더 섞어 넣는다 (예: 40곡 중 25% = 10곡).
  # 정확히 특정 길이에 맞추지 않고, 어떤 곡이 재사용되느냐에 따라 매번 자연스럽게 다른 길이가 나오게 하기 위함.
  reuse_ratio: 0.25
  bitrate: "192k"

image:
  provider: gemini
  model: gemini-2.5-flash-image # 일명 "나노바나나". 무료 등급 하루 500장까지.
  aspect_ratio_hint: "16:9 widescreen" # 프롬프트에 덧붙이는 문구. 실제 크롭/스케일은 build_video.py가 처리.

youtube:
  category_id: "10" # Music
  privacy_status: "public"
  made_for_kids: false
  contains_synthetic_media: true # 음악/이미지에 AI가 관여했음을 유튜브에 공개 고지

state_file: "state/state.json"
music_library_dir: "music_library"
