# 파이프라인 전역 설정

# 리브랜딩 전환 스위치. legacy = 기존 일반 로파이 컨셉 / joseon = 조선 로파이 컨셉
# (scenes_joseon.yml + title_templates_joseon.yml + 썸네일 + 무드 로테이션 활성화).
# D-day에 joseon으로 바꾸기 전 필요한 것: Drive 음악 폴더 안에 calm/, groove/ 하위
# 폴더를 만들고 각 무드의 mp3를 채워야 한다.
concept: joseon
video:
  # 목표 길이를 강제하지 않음 - audio.track_count_min~max 범위에서 무작위로 뽑힌 곡 수만큼의 길이가 그대로 영상 길이가 됨.
  resolution: "1920x1080"
  fps: 2 # 정적 이미지 반복이라 낮은 fps로도 충분. 재생 호환성을 위해 최소 1 이상 유지.
  crf: 20
  preset: fast

audio:
  crossfade_seconds: 3
  # 라이브러리가 충분히 커져서(90곡+) 매번 40~50곡을 셔플백으로 무작위로 뽑아 쓴다.
  # 한 영상 안에서는 같은 곡이 중복되지 않고, 셔플백이라 라이브러리 전체를 순환하며 소진될 때까지 반복되지 않는다.
  track_count_min: 40
  track_count_max: 50
  # 더 이상 곡 재사용으로 길이를 늘릴 필요가 없어 비활성화 (라이브러리 자체가 충분히 큼).
  reuse_ratio: 0.0
  bitrate: "192k"

image:
  provider: gemini
  model: gemini-2.5-flash-image # 일명 "나노바나나". 무료 등급 하루 500장까지.
  aspect_ratio_hint: "16:9 widescreen" # 프롬프트에 덧붙이는 문구. 실제 크롭/스케일은 build_video.py가 처리.

youtube:
  category_id: "10" # Music
  # 항상 비공개로 먼저 올리고, 사용자가 채팅에서 확인해준 뒤 finalize-publish.yml로 공개 전환한다.
  privacy_status: "private"
  made_for_kids: false
  contains_synthetic_media: true # 음악/이미지에 AI가 관여했음을 유튜브에 공개 고지

state_file: "state/state.json"
music_library_dir: "music_library"
