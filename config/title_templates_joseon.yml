# [조선 리브랜딩] 제목/설명/태그/썸네일 문구 풀. settings.yml의 concept: joseon일 때만 사용.
#
# 채널 컨셉 = "조선 로파이" 단일 장르, 무드 2종 로테이션:
#   calm   = 집중용 잔잔한 로파이 (공부/작업) — 채널의 기둥
#   groove = 산책/드라이브용 신나는 로파이 (가야금 힙합 계열)
#
# situations의 title은 영상 제목에, thumb_main/thumb_sub는 썸네일 텍스트(노란 메인 +
# 흰 서브)에 들어간다. 제목과 썸네일이 항상 같은 상황을 말하도록 세트 로테이션(id 기준).
# 모든 항목에 장르명(조선 로파이)이 main 또는 sub 어딘가에 반드시 들어가야 한다 —
# 썸네일만 보고도 무슨 음악인지 알 수 있게 (사용자 요청).

title_prefix: "Playlist"

# 무드 로테이션 (셔플백). calm 2 : groove 1 비율.
genre_rotation: [calm, calm, groove]

