# 비주얼(정적 이미지) 씬 프롬프트 풀. state_manager가 셔플백 방식으로 순환 사용.
# 그림체(따뜻한 애니메이션 일러스트) 공통 스타일 문구는 generate_image.py가 자동으로 덧붙인다.
#
# [조선 세계관 리브랜딩]
# 채널 정체성 = "갓 쓴 조선 선비" 고정 주인공. 모든 씬에 같은 인물 묘사(CHARACTER)를
# 반복해 넣어 어떤 씬이 뽑혀도 피드에서 한 채널로 알아볼 수 있게 한다 (Lofi Girl 공식).
# 변주는 장소/계절/시간대/소품으로만 준다 — 인물과 그림체는 절대 바꾸지 않는다.
#
# category는 재생목록 분류용 (upload_youtube.get_or_create_playlist가 category별로
# 별도 재생목록을 만들어 관리 -> title_templates.yml의 playlist_titles와 매칭).
# 주의: category id(study/night/cafe/morning)는 state.json의 playlist_ids 키와 묶여
# 있으므로 이름을 바꾸면 재생목록이 새로 생긴다. id는 유지하고 내용만 조선풍으로 교체함.

scenes:
  - id: seodang_seoan
    category: study
    prompt: >-
      a young Joseon-era Korean scholar wearing a simple white and indigo hanbok
      and a black gat (traditional wide-brimmed horsehair hat), seen from behind,
      sitting on the floor at a low wooden writing desk (seoan) in a cozy hanok
      study room, holding a calligraphy brush over hanji paper, tall stacks of
      traditional bound books beside the desk, wooden lattice doors covered with
      warm hanji paper in the background
  - id: sungkyunkwan_hall
    category: study
    prompt: >-
      wide shot of a grand Joseon-era wooden lecture hall interior with rows of
      empty low study desks receding into the distance, a single young scholar in
      white-indigo hanbok and black gat seen from behind studying alone at one
      desk, tall wooden pillars and beams, soft light falling through open
      lattice doors
  - id: winter_ondol
    category: study
    prompt: >-
      a young Joseon-era Korean scholar in white-indigo hanbok and black gat,
      seen from behind, reading at a low desk in a warm ondol-heated hanok room,
      thick cotton blanket over his lap, snow falling outside visible through a
      slightly open hanji lattice window, piles of traditional books and a small
      brazier beside him
  - id: autumn_seowon
    category: study
    prompt: >-
      a young Joseon-era Korean scholar in white-indigo hanbok and black gat seen
      from behind at a low writing desk placed near the wide-open wooden doors of
      a seowon study hall, looking out at a courtyard full of brilliant red and
      orange maple trees, fallen autumn leaves scattered on the wooden porch,
      books and brush pots around the desk
  - id: candlelit_night
    category: night
    prompt: >-
      dramatic low-key night scene, a young Joseon-era Korean scholar in white
      hanbok seen from behind writing by the small warm glow of a single oil lamp
      (deungjanbul) on a low desk, the lamp casting a small pool of light on hanji
      paper and an inkstone, the rest of the hanok room fading into deep shadow,
      moonlit lattice window faintly visible behind
  - id: moon_pavilion
    category: night
    prompt: >-
      a young Joseon-era Korean scholar in white-indigo hanbok and black gat seen
      from behind, sitting in an open wooden pavilion (jeongja) at night reading a
      book under a huge full moon, the pavilion overlooking a still lotus pond
      reflecting the moonlight, distant mountain silhouettes, fireflies drifting
      in the dark air
  - id: rainy_maru
    category: cafe
    prompt: >-
      a young Joseon-era Korean scholar in white-indigo hanbok seen from behind,
      sitting on the wooden porch floor (daecheongmaru) of a hanok under the
      eaves during heavy rain, a book and a steaming cup of tea beside him,
      raindrops dripping from the tiled roof edge in the foreground, wet stone
      courtyard and glistening trees beyond
  - id: hanok_teahouse
    category: cafe
    prompt: >-
      interior of a cozy traditional Korean teahouse, a young Joseon-era scholar
      in white-indigo hanbok and black gat seen from behind at a low wooden table
      with a celadon teapot and steaming teacup, reading a small book, shelves of
      ceramic tea jars along the wall, warm light through hanji windows
  - id: morning_madang
    category: morning
    prompt: >-
      wide shot of a misty hanok courtyard (madang) at sunrise, a young
      Joseon-era Korean scholar in white-indigo hanbok and black gat seen from
      behind standing on the stone steps holding an open book, soft golden
      morning haze over the tiled roofs, a big old tree by the low stone wall,
      quiet and serene atmosphere

modifiers:
  lighting:
    - "warm flickering oil lamp glow"
    - "pale blue moonlight"
    - "soft golden dawn haze"
    - "warm afternoon sun filtering through hanji lattice doors"
    - "overcast rainy-day diffused light"
    - "bright soft light reflected off fresh snow"
    - "deep orange sunset glow on the wooden floor"
  details:
    - "an inkstone with a half-ground ink stick beside the desk"
    - "a wooden brush stand with several calligraphy brushes"
    - "a celadon teacup with steam rising"
    - "a small charcoal brazier with a kettle gently steaming"
    - "a plum blossom branch in a white porcelain vase"
    - "a tall stack of traditional stitched-bound books"
    - "a folding fan resting on the floor"
    - "a paper lantern hanging from the eaves"
    - "a half-unrolled scroll of calligraphy"
    - "a small cat curled up asleep nearby"
