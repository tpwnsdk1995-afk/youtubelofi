name: Finalize publish (confirm)

# 사용자가 채팅에서 확인해준 뒤에만 수동으로 트리거된다.
# publish-video.yml이 비공개로 올려둔 영상을 공개로 전환하고(필요시 제목/설명도 함께 수정),
# ffmpeg 등 무거운 의존성 없이 YouTube API 호출만 수행하므로 몇 초 안에 끝난다.
on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "공개로 전환할 영상 ID"
        required: true
        type: string
      privacy_status:
        description: "적용할 공개 상태"
        required: false
        type: string
        default: "public"
      title:
        description: "제목을 바꾸려면 새 제목 (비워두면 유지)"
        required: false
        type: string
      description:
        description: "설명을 바꾸려면 새 설명 (비워두면 유지)"
        required: false
        type: string

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install google-api-python-client google-auth

      - name: Finalize publish
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          ARGS=("--video-id" "${{ inputs.video_id }}" "--privacy-status" "${{ inputs.privacy_status }}")
          if [ -n "${{ inputs.title }}" ]; then
            ARGS+=("--title" "${{ inputs.title }}")
          fi
          if [ -n "${{ inputs.description }}" ]; then
            ARGS+=("--description" "${{ inputs.description }}")
          fi
          python3 scripts/finalize_publish.py "${ARGS[@]}"
