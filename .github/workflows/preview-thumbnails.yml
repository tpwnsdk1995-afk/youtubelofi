name: Preview Joseon thumbnails (diagnostic)

# 조선 리브랜딩 썸네일의 실물 퀄리티 확인용 일회성 워크플로우.
# 실제 Gemini로 이미지 3종을 생성해 팝 텍스트를 합성한 뒤 텔레그램으로 보낸다.
# 컨셉 확정 전 시안 검증에만 쓰고, 확정 후엔 삭제해도 된다.
on:
  workflow_dispatch: {}

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install deps and font
        run: |
          pip install requests Pillow
          curl -sSf -o BlackHanSans.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/blackhansans/BlackHanSans-Regular.ttf"

      - name: Generate and send previews
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRIPT_B64: ""
        run: |
          echo "$SCRIPT_B64" | base64 -d > preview_thumbs.py
          python3 preview_thumbs.py
