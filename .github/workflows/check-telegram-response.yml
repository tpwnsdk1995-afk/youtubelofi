name: Check Telegram response

# 텔레그램 승인/거부 버튼 응답을 확인해서 반영하는 워크플로우.
# 열려있는 pending-confirmation 이슈 중 가장 최근 것의 영상 ID로 폴링하고,
# 승인이면 공개 전환 + 이슈 닫기, 거부면 영상을 유튜브에서 삭제하고 이슈를
# 닫는다(비공개 유지 -> 이후 auto-publish.yml이 열린 이슈를 못 찾으므로
# 19:03 자동 공개도 더 이상 덮어쓰지 않는다), 응답이 아직 없으면 아무 것도
# 하지 않는다.
#
# 카페24 호스팅의 SSL이 깨져있어(TLS handshake 실패) 텔레그램이 실시간
# 웹훅(webhook/telegram-webhook.php)으로 업데이트를 전달하지 못한다 —
# getWebhookInfo의 last_error_message로 확인됨. 그래서 이 폴링 워크플로우를
# 안전망으로 복원했다. SSL이 고쳐지면 다시 웹훅 방식으로 전환 가능.
on:
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Find pending confirmation issue
        id: find
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "pending-confirmation",
              sort: "created",
              direction: "desc",
              per_page: 1,
            });
            if (issues.data.length === 0) {
              core.setOutput("found", "false");
              return;
            }
            const issue = issues.data[0];
            const match = issue.title.match(/영상 공개 확인 필요: (\S+)/);
            core.setOutput("found", "true");
            core.setOutput("issue_number", issue.number);
            core.setOutput("video_id", match ? match[1] : "");

      - uses: actions/checkout@v4
        if: steps.find.outputs.found == 'true'

      - uses: actions/setup-python@v5
        if: steps.find.outputs.found == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.find.outputs.found == 'true'
        run: pip install google-api-python-client google-auth

      - name: Poll Telegram
        id: poll
        if: steps.find.outputs.found == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          decision=$(python3 scripts/poll_telegram_response.py "--video-id=${{ steps.find.outputs.video_id }}")
          echo "decision=$decision" >> "$GITHUB_OUTPUT"

      - name: Finalize publish (approved)
        if: steps.find.outputs.found == 'true' && steps.poll.outputs.decision == 'approve'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python3 scripts/finalize_publish.py "--video-id=${{ steps.find.outputs.video_id }}" --privacy-status=public

      - name: Close issue (approved)
        if: steps.find.outputs.found == 'true' && steps.poll.outputs.decision == 'approve'
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = ${{ steps.find.outputs.issue_number }};
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: "텔레그램에서 승인되어 공개 전환되었습니다.",
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              state: "closed",
            });

      - name: Delete video (rejected)
        if: steps.find.outputs.found == 'true' && steps.poll.outputs.decision == 'reject'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python3 scripts/delete_video.py "--video-id=${{ steps.find.outputs.video_id }}"

      - name: Close issue (rejected)
        if: steps.find.outputs.found == 'true' && steps.poll.outputs.decision == 'reject'
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = ${{ steps.find.outputs.issue_number }};
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: "텔레그램에서 거부되어 영상이 유튜브에서 삭제되었습니다.",
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              state: "closed",
              state_reason: "not_planned",
            });
