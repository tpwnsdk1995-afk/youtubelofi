name: Runner allocation probe

# publish-video.yml이 러너 할당 자체가 안 붙어(runner_id:0, billable 0ms) 15분+
# 큐에 멈추어있다가 취소되는 문제가 반복되고 있다. ubuntu-latest 이미지 자체의
# 일시적 롤아웃/용량 문제인지 확인하기 위해 다른 러너 라벨(ubuntu-22.04)로
# 최소한의 job을 돌려본다.
on:
  workflow_dispatch: {}

jobs:
  probe-22:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - run: echo "ubuntu-22.04 runner attached at $(date -u)"

  probe-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: echo "ubuntu-latest runner attached at $(date -u)"
