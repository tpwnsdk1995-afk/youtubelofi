name: Set Telegram webhook (real-time mode)

# 텔레그램 봇이 실시간으로 카페24에 배포된 telegram-webhook.php로 업데이트를 푸시하도록
# 등록한다. 텔레그램 API는 웹훅과 getUpdates 폴링을 동시에 쓸 수 없으므로, 이걸 실행하면
# 그 순간부터 check-telegram-response.yml의 폴링(getUpdates)은 더 이상 새 이벤트를 받지
# 못한다 — 대신 handle-telegram-decision.yml이 실시간으로 즉시 처리한다.
# webhook/telegram-webhook.php가 먼저 배포되어 있어야 한다 (deploy-telegram-webhook.yml).
on:
  workflow_dispatch: {}

jobs:
  set-webhook:
    runs-on: ubuntu-latest
    steps:
      - name: Call Telegram setWebhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          response=$(curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            -H "Content-Type: application/json" \
            -d "{\"url\": \"https://issuejupjup.com/telegram-webhook.php\", \"secret_token\": \"${TELEGRAM_WEBHOOK_SECRET}\"}")
          echo "$response"
          echo "$response" | grep -q '"ok":true' || (echo "setWebhook 실패" && exit 1)

      - name: Verify webhook info
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo"
