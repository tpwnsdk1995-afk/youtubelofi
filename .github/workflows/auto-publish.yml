name: Auto-publish (daily deadline)

# 확인 요청(publish-video.yml이 여는 pending-confirmation 이슈) 이후 사용자가 텔레그램
# 버튼으로 승인/거부하지 않으면, 매일 정해진 시각에 자동으로 공개 전환한다. 업로드 시각의
# 일관성이 알고리즘에 도움이 되므로 "컨펌 안 하면 무기한 비공개" 대신 "특별한 요청이 없으면
# 예정대로 공개"를 기본값으로 한다. 텔레그램에서 이미 승인/거부돼 이슈가 닫혀 있으면
# 조용히 아무 것도 하지 않는다. (이 워크플로우가 실제로 이슈를 찾아 발행하는 시점엔 승인/거부
# 버튼이 눌리지 않았다는 게 보장되므로, 무응답 자동 공개 케이스도 텔레그램으로 알려준다.)
#
# 트리거는 GitHub 자체 schedule이 아니라 매일 19:14 KST에 발동하는 Claude Code Remote
# Routine이 workflow_dispatch로 담당한다. 이 워크플로우의 schedule 트리거는 cron 설정이
# 맞는데도 한 번도 스스로 발동한 적이 없어 제거했다.
on:
  workflow_dispatch: {}
  # 보조 트리거. 주 트리거는 19:14 KST의 Routine이고, 이건 Routine이 깨어나지
  # 못한 날을 메운다. 19:30 KST = 10:30 UTC.
  # 이 워크플로우는 본래 멱등하다 — 열려 있는 pending-confirmation 이슈를 찾아
  # 공개하고, 없으면(이미 공개됐거나 그날 영상이 없으면) 조용히 아무 일도 하지
  # 않는다. 그래서 중복 방지 가드가 따로 필요 없다.
  schedule:
    - cron: "30 10 * * *"

permissions:
  issues: write

jobs:
  auto-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Find pending confirmation issue
        id: find
        uses: actions/github-script@v7
        env:
          EVENT_NAME: ${{ github.event_name }}
        with:
          script: |
            // 보조 cron이 자정을 넘겨 지연 도착하면 새벽에 영상을 공개해 버린다
            // (실제로 8/31분 19:30 cron이 9/1 02:40에 발동해 방금 올라온 영상을
            // 즉시 공개한 사고 발생). 자동 공개는 19:14 KST 정시가 원칙이므로
            // schedule 이벤트는 19시 이후(같은 날 저녁)에만 실제 동작한다.
            // 시간대 밖이면 아무것도 하지 않고, 열린 이슈는 다음 날 19:14의
            // 주 트리거가 공개한다 (설계된 "다음 날 공개" 경로).
            if (process.env.EVENT_NAME === 'schedule') {
              const kstHour = new Date(Date.now() + 9 * 3600 * 1000).getUTCHours();
              if (kstHour < 19) {
                core.setOutput('found', 'false');
                core.notice(`지연 cron 무시: 유효 시간대(19시 이후 KST) 밖 도착 (KST ${kstHour}시)`);
                return;
              }
            }
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "pending-confirmation",
              sort: "created",
              direction: "desc",
              per_page: 1,
            });
            if (issues.data.length === 0) {
              core.setOutput("found", "false");
              return;
            }
            const issue = issues.data[0];
            const idMatch = issue.title.match(/영상 공개 확인 필요: (\S+)/);
            const titleMatch = issue.body.match(/^제목: (.+)$/m);
            core.setOutput("found", "true");
            core.setOutput("issue_number", issue.number);
            core.setOutput("video_id", idMatch ? idMatch[1] : "");
            core.setOutput("title", titleMatch ? titleMatch[1] : "");

      - uses: actions/checkout@v4
        if: steps.find.outputs.found == 'true'

      - uses: actions/setup-python@v5
        if: steps.find.outputs.found == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.find.outputs.found == 'true'
        run: pip install google-api-python-client google-auth

      - name: Publish
        if: steps.find.outputs.found == 'true'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python3 scripts/finalize_publish.py "--video-id=${{ steps.find.outputs.video_id }}" --privacy-status=public

      - name: Close confirmation issue
        if: steps.find.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = ${{ steps.find.outputs.issue_number }};
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: "별도 요청이 없어 예정대로(19:14 KST) 자동 공개 전환되었습니다.",
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              state: "closed",
            });

      - name: Notify Telegram (deadline auto-publish)
        if: steps.find.outputs.found == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 scripts/send_telegram_message.py "--text=⏰ 응답이 없어 예정대로 자동 공개됨: ${{ steps.find.outputs.title }}
          https://youtu.be/${{ steps.find.outputs.video_id }}"

      # 19:30 schedule이 실제로 공개를 처리했다 = 19:14 주 트리거(Routine)가 그날
      # 공개를 못 했다는 뜻이다 (Routine이 정상이면 19:14에 이미 공개돼 여기서는
      # 이슈가 안 잡힌다). 보조가 조용히 메우면 Routine 사망을 모르므로 경고를 보낸다.
      # 드물게 생성이 늦어 19:14 이후에 이슈가 열린 날은 오탐일 수 있다 — 경고를
      # 받으면 Routine/세션 상태만 확인하면 된다.
      - name: Warn Telegram that backup schedule took over
        if: steps.find.outputs.found == 'true' && github.event_name == 'schedule'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=⚠️ 이번 자동 공개는 보조 스케줄(19:30)이 처리했습니다. 19:14 주 트리거(Claude Routine)가 돌지 않았다는 신호이니 Claude 세션/Routine 상태를 확인해 주세요." || echo "텔레그램 경고 전송 실패"
