name: Auto-publish (daily deadline)

# 확인 요청(publish-video.yml이 여는 pending-confirmation 이슈) 이후 사용자가 채팅에서
# 수정/보류를 요청하지 않으면, 매일 정해진 시각에 자동으로 공개 전환한다. 업로드 시각의
# 일관성이 알고리즘에 도움이 되므로 "컨펌 안 하면 무기한 비공개" 대신 "특별한 요청이 없으면
# 예정대로 공개"를 기본값으로 한다. 사용자가 이미 채팅에서 확인/수정해 이슈가 닫혀 있으면
# 조용히 아무 것도 하지 않는다.
on:
  schedule:
    - cron: "0 10 * * *" # 매일 UTC 10:00 (KST 19:00)
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  auto-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Find pending confirmation issue
        id: find
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "pending-confirmation",
              sort: "created",
              direction: "desc",
              per_page: 1,
            });
            if (issues.data.length === 0) {
              core.setOutput("found", "false");
              return;
            }
            const issue = issues.data[0];
            const match = issue.title.match(/영상 공개 확인 필요: (\S+)/);
            core.setOutput("found", "true");
            core.setOutput("issue_number", issue.number);
            core.setOutput("video_id", match ? match[1] : "");

      - uses: actions/checkout@v4
        if: steps.find.outputs.found == 'true'

      - uses: actions/setup-python@v5
        if: steps.find.outputs.found == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.find.outputs.found == 'true'
        run: pip install google-api-python-client google-auth

      - name: Publish
        if: steps.find.outputs.found == 'true'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python3 scripts/finalize_publish.py --video-id "${{ steps.find.outputs.video_id }}" --privacy-status public

      - name: Close confirmation issue
        if: steps.find.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = ${{ steps.find.outputs.issue_number }};
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: "별도 요청이 없어 예정대로(19:00 KST) 자동 공개 전환되었습니다.",
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              state: "closed",
            });
