name: Make legacy videos private (rebrand one-off)

# 조선로파이 리브랜딩 전환용: 기존 노아뮤직 시절 영상을 전부 비공개로 내린다.
# 삭제가 아니라 비공개라 되돌릴 수 있다. 전환 후엔 이 워크플로우를 삭제해도 된다.
on:
  workflow_dispatch: {}

jobs:
  private:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Set all existing videos to private
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SCRIPT_B64: ""
        run: |
          echo "$SCRIPT_B64" | base64 -d > legacy_private.py
          python3 legacy_private.py
