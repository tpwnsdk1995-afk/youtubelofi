name: Publish lofi video

# 트리거는 GitHub 자체 cron이 아니라 매일 17:15 KST에 발동하는 Claude Code Remote
# Routine이 workflow_dispatch로 담당한다. GitHub의 schedule 트리거는 지연/누락이
# 잦았고(수 시간 지연되거나 아예 스킵됨), Routine이 이미 대신 실행한 뒤에 뒤늦게
# 발동해 같은 날 중복 영상이 생성된 적도 있어 제거했다.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true면 실제 업로드 없이 파이프라인만 검증"
        type: boolean
        default: false

concurrency:
  group: publish-video
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg and Korean brush font (썸네일 붓글씨용)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-nanum

      - name: Verify ffmpeg is available
        run: ffmpeg -version && ffprobe -version

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        id: pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_MUSIC_FOLDER_ID: ${{ secrets.GDRIVE_MUSIC_FOLDER_ID }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          python3 scripts/pipeline.py $ARGS --result-output result.json

      - name: Commit updated rotation state
        if: success()
        run: |
          git config user.name "lofi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/state.json
          git commit -m "Update rotation state after publish run" || echo "no state changes to commit"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}

      - name: Open confirmation issue (non-dry-run success)
        if: success() && inputs.dry_run != true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('result.json', 'utf8'));
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `영상 공개 확인 필요: ${result.video_id}`,
              body: `제목: ${result.title}\n` +
                    `비공개 링크: https://youtu.be/${result.video_id}\n\n` +
                    `---\n${result.description}`,
              labels: ["pending-confirmation"],
            });

      - name: Send Telegram confirmation (non-dry-run success)
        if: success() && inputs.dry_run != true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          video_id=$(python3 -c "import json; print(json.load(open('result.json'))['video_id'])")
          title=$(python3 -c "import json; print(json.load(open('result.json'))['title'])")
          python3 scripts/send_telegram_confirmation.py "--video-id=$video_id" "--title=$title"

      - name: Open issue on failure (library shortage, API errors, etc.)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Publish workflow failed: ${new Date().toISOString().slice(0,10)}`,
              body: `워크플로우 실행이 실패했습니다. 로그를 확인해 주세요: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
                    `가장 흔한 원인은 Google Drive 음악 라이브러리 폴더의 음원 부족입니다. Suno에서 새 배치를 다운로드해 Drive 폴더에 추가해 주세요.`,
              labels: ["automation-failure"],
            });
