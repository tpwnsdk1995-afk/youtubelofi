name: Publish lofi video

# 주 트리거는 매일 17:15 KST에 발동하는 Claude Code Remote Routine의 workflow_dispatch다.
# GitHub의 schedule 트리거는 지연/누락이 잦아(수 시간 지연되거나 아예 스킵됨) 주 트리거로는
# 쓸 수 없다. 과거에 Routine이 이미 실행한 뒤 schedule이 뒤늦게 발동해 같은 날 영상이
# 2편 생성된 적이 있어 제거했었다.
#
# 그런데 Routine은 Claude 세션을 깨우는 방식이라, 사용 한도 초과로 세션이 응답하지 못하면
# 그날이 통째로 누락된다(2026-08-22~25, 4일 연속 누락). 그래서 schedule을 "보조 트리거"로
# 되살리되, 중복 생성을 워크플로우 스스로 막도록 아래 guard 잡을 먼저 둔다.
#
# guard는 "오늘(KST) 이미 영상이 나갔는가"를 pending-confirmation 이슈의 생성 시각으로
# 판단한다. 이 이슈는 non-dry-run 성공 시에만 열리므로 리허설이 실제 생성을 막는 오탐이
# 없고, Claude가 깨어 있든 아니든 워크플로우 혼자 판단할 수 있다.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true면 실제 업로드 없이 파이프라인만 검증"
        type: boolean
        default: false
      concept:
        description: "settings.yml의 concept 일회성 오버라이드 (리허설용, 비우면 설정값 사용)"
        type: string
        default: ""
      force:
        description: "true면 오늘 이미 영상이 나갔어도 강제로 다시 생성 (하루 2편이 되므로 주의)"
        type: boolean
        default: false
  # 보조 트리거. 주 트리거는 매일 17:15 KST의 Routine이고, 이건 Routine이
  # 한도초과 등으로 깨어나지 못한 날을 메운다. 18:10 KST = 09:10 UTC.
  # Routine이 정상 동작한 날은 위 guard 잡이 3초 만에 건너뛰므로 아무 일도 없다.
  # schedule은 inputs를 주지 않으므로 dry_run/force 모두 false로 동작한다.
  schedule:
    - cron: "10 9 * * *"

concurrency:
  group: publish-video
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  guard:
    # 오늘 이미 영상이 나갔으면 publish 잡을 통째로 건너뛴다.
    # 유튜브 반복 콘텐츠 정책상 하루 2편은 절대 금지이므로, 이 판단은
    # Claude(Routine)가 아니라 워크플로우 자신이 할 수 있어야 한다.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - id: check
        uses: actions/github-script@v7
        env:
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
          EVENT_NAME: ${{ github.event_name }}
        with:
          script: |
            const kstDate = (iso) =>
              new Date(new Date(iso).getTime() + 9 * 3600 * 1000)
                .toISOString().slice(0, 10);

            if (process.env.FORCE === 'true') {
              core.setOutput('skip', 'false');
              core.setOutput('reason', '강제 실행(force=true)');
              return;
            }
            // 리허설은 영상을 올리지 않으므로 막을 이유가 없다.
            if (process.env.DRY_RUN === 'true') {
              core.setOutput('skip', 'false');
              core.setOutput('reason', '리허설(dry_run=true)');
              return;
            }

            // 보조 cron이 심하게 지연되면 자정을 넘겨 도착해 "다음 날" 영상을
            // 새벽에 만들어 버린다 (실제로 8/31분 18:10 cron이 9/1 02:02에 발동해
            // 새벽 생성 + 02:40 즉시 공개 사고 발생 — 날짜 가드는 자정이 지나면
            // 어제 이슈를 못 보기 때문). 보조의 역할은 "그날 저녁의 누락 방지"
            // 이므로 유효 시간대(17~23시 KST) 밖이면 건너뛴다. 새 날의 생성은
            // 그날의 주 트리거(17:15 Routine)와 제 시간의 보조가 담당한다.
            if (process.env.EVENT_NAME === 'schedule') {
              const kstHour = new Date(Date.now() + 9 * 3600 * 1000).getUTCHours();
              if (kstHour < 17 || kstHour >= 23) {
                core.setOutput('skip', 'true');
                core.setOutput('reason',
                  `보조 cron이 유효 시간대(17~23시 KST) 밖에 도착 (KST ${kstHour}시) - 건너뜀`);
                core.notice(`지연 cron 무시: KST ${kstHour}시`);
                return;
              }
            }

            const today = kstDate(new Date().toISOString());
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              labels: 'pending-confirmation',
              per_page: 30,
              sort: 'created',
              direction: 'desc',
            });
            // listForRepo는 PR도 함께 돌려주므로 걸러낸다.
            const madeToday = issues.data.filter(
              (i) => !i.pull_request && kstDate(i.created_at) === today
            );

            if (madeToday.length > 0) {
              const titles = madeToday.map((i) => `#${i.number} ${i.title}`).join(', ');
              core.setOutput('skip', 'true');
              core.setOutput('reason', `오늘(${today} KST) 이미 영상이 생성됨: ${titles}`);
              core.notice(`중복 생성 방지: ${titles}`);
            } else {
              core.setOutput('skip', 'false');
              core.setOutput('reason', `오늘(${today} KST) 생성 기록 없음 - 진행`);
            }

      - name: Report guard decision
        run: |
          echo "skip=${{ steps.check.outputs.skip }}"
          echo "reason=${{ steps.check.outputs.reason }}"
          echo "### 중복 방지 가드" >> $GITHUB_STEP_SUMMARY
          echo "- 판정: ${{ steps.check.outputs.skip == 'true' && '건너뜀' || '진행' }}" >> $GITHUB_STEP_SUMMARY
          echo "- 근거: ${{ steps.check.outputs.reason }}" >> $GITHUB_STEP_SUMMARY

  publish:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # 이 잡이 schedule 이벤트로 실행됐다 = 주 트리거(17:15 Routine)가 오늘 생성을
      # 처리하지 못해 보조가 떠맡았다는 뜻이다. 2026-08-29 저장소 이름 변경으로
      # Routine이 전부 죽었을 때 보조가 조용히 메꿔서 3일간 아무도 몰랐다 —
      # 그래서 보조가 실제 작업을 할 때는 반드시 소리를 내게 한다.
      # 경고 전송 실패가 생성을 막으면 안 되므로 curl 실패는 무시한다.
      - name: Warn Telegram that backup schedule took over
        if: github.event_name == 'schedule'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=⚠️ 오늘 영상 생성이 보조 스케줄로 실행됩니다. 주 트리거(17:15 Claude Routine)가 돌지 않았다는 신호이니 Claude 세션/Routine 상태를 확인해 주세요. 영상 자체는 이 실행으로 정상 생성됩니다." || echo "텔레그램 경고 전송 실패 (생성은 계속 진행)"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ubuntu-latest 러너 이미지에는 보통 ffmpeg가 이미 들어 있다. 그런데도 매번
      # apt를 돌리다가 2026-08-19 run #34에서 apt가 60분간 멈춰 job 전체가
      # timeout-minutes(60)에 걸려 취소됐고, 그날 영상이 통째로 누락됐다.
      # 그래서 (1) 이미 있으면 apt를 아예 건너뛰고, (2) 필요할 때만 재시도하며,
      # (3) 이 단계에 자체 타임아웃을 걸어 멈춰도 job 예산을 다 먹지 않게 한다.
      - name: Ensure ffmpeg is available
        timeout-minutes: 10
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "ffmpeg/ffprobe already present on runner image - skipping apt"
          else
            installed=0
            for i in 1 2 3; do
              if sudo apt-get update && sudo apt-get install -y ffmpeg; then
                installed=1
                break
              fi
              echo "apt attempt $i failed; retrying in $((i * 10))s"
              sleep $((i * 10))
            done
            if [ "$installed" -ne 1 ]; then
              echo "ffmpeg 설치 실패 (apt 3회 재시도 모두 실패)" >&2
              exit 1
            fi
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        id: pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_MUSIC_FOLDER_ID: ${{ secrets.GDRIVE_MUSIC_FOLDER_ID }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          if [ -n "${{ inputs.concept }}" ]; then
            ARGS="$ARGS --concept ${{ inputs.concept }}"
          fi
          python3 scripts/pipeline.py $ARGS --result-output result.json

      - name: Commit updated rotation state
        if: success()
        run: |
          git config user.name "lofi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/state.json
          git commit -m "Update rotation state after publish run" || echo "no state changes to commit"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}

      - name: Send dry-run thumbnail preview to Telegram (리허설 확인용)
        if: success() && inputs.dry_run == true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -f thumbnail_preview.jpg ]; then
            title=$(python3 -c "import json; print(json.load(open('result.json'))['title'])")
            curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto"               -F "chat_id=${TELEGRAM_CHAT_ID}"               -F "photo=@thumbnail_preview.jpg"               -F "caption=[리허설 dry-run] 실제 파이프라인이 만든 썸네일입니다. 제목: $title"
          else
            echo "썸네일 미리보기 없음 (legacy 컨셉이거나 생성 실패)"
          fi

      - name: Open confirmation issue (non-dry-run success)
        if: success() && inputs.dry_run != true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('result.json', 'utf8'));
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `영상 공개 확인 필요: ${result.video_id}`,
              body: `제목: ${result.title}\n` +
                    `비공개 링크: https://youtu.be/${result.video_id}\n\n` +
                    `---\n${result.description}`,
              labels: ["pending-confirmation"],
            });

      - name: Send Telegram confirmation (non-dry-run success)
        if: success() && inputs.dry_run != true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          video_id=$(python3 -c "import json; print(json.load(open('result.json'))['video_id'])")
          title=$(python3 -c "import json; print(json.load(open('result.json'))['title'])")
          python3 scripts/send_telegram_confirmation.py "--video-id=$video_id" "--title=$title"

      - name: Open issue on failure (library shortage, API errors, etc.)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Publish workflow failed: ${new Date().toISOString().slice(0,10)}`,
              body: `워크플로우 실행이 실패했습니다. 로그를 확인해 주세요: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
                    `가장 흔한 원인은 Google Drive 음악 라이브러리 폴더의 음원 부족입니다. Suno에서 새 배치를 다운로드해 Drive 폴더에 추가해 주세요.`,
              labels: ["automation-failure"],
            });
