name: Publish lofi video

on:
  schedule:
    # 매일 UTC 08:00 (KST 17:00). 목표 공개 시각(19:00 KST)보다 2시간 일찍 실행해,
    # 생성+비공개 업로드(최대 약 40분) 후에도 사용자가 확인할 시간을 충분히 확보한다.
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true면 실제 업로드 없이 파이프라인만 검증"
        type: boolean
        default: false

concurrency:
  group: publish-video
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Verify ffmpeg is available
        run: ffmpeg -version && ffprobe -version

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        id: pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_MUSIC_FOLDER_ID: ${{ secrets.GDRIVE_MUSIC_FOLDER_ID }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          python3 scripts/pipeline.py $ARGS --result-output result.json

      - name: Commit updated rotation state
        if: success()
        run: |
          git config user.name "lofi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/state.json
          git commit -m "Update rotation state after publish run" || echo "no state changes to commit"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}

      - name: Open confirmation issue (non-dry-run success)
        if: success() && inputs.dry_run != true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('result.json', 'utf8'));
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `영상 공개 확인 필요: ${result.video_id}`,
              body: `제목: ${result.title}\n` +
                    `비공개 링크: https://youtu.be/${result.video_id}\n\n` +
                    `---\n${result.description}`,
              labels: ["pending-confirmation"],
            });

      - name: Open issue on failure (library shortage, API errors, etc.)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Publish workflow failed: ${new Date().toISOString().slice(0,10)}`,
              body: `워크플로우 실행이 실패했습니다. 로그를 확인해 주세요: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
                    `가장 흔한 원인은 Google Drive 음악 라이브러리 폴더의 음원 부족입니다. Suno에서 새 배치를 다운로드해 Drive 폴더에 추가해 주세요.`,
              labels: ["automation-failure"],
            });
