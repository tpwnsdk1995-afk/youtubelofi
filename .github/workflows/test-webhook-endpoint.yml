name: Test Telegram webhook endpoint (diagnostic)

# 실제 텔레그램 버튼 클릭 없이, 카페24에 배포된 telegram-webhook.php가 정상 동작하는지
# 안전하게 검증한다. 존재하지 않는 가짜 video_id로 callback_query를 흉내내어 POST하므로
# handle-telegram-decision.yml이 실행되더라도 "일치하는 이슈 없음"으로 끝나고 실제 영상에는
# 아무 영향을 주지 않는다.
on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send fake callback_query to webhook
        env:
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          http_code=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" -X POST \
            "https://issuejupjup.com/telegram-webhook.php" \
            -H "Content-Type: application/json" \
            -H "X-Telegram-Bot-Api-Secret-Token: ${TELEGRAM_WEBHOOK_SECRET}" \
            -d '{
              "update_id": 1,
              "callback_query": {
                "id": "diagnostic-test-callback",
                "data": "reject:DIAGNOSTIC_TEST_VIDEO_ID",
                "message": {"message_id": 1, "chat": {"id": 0}, "text": "diagnostic test"}
              }
            }')
          echo "HTTP status: $http_code"
          echo "Response body:"
          cat /tmp/resp.txt
          echo
          if [ "$http_code" != "200" ]; then
            echo "웹훅이 200을 반환하지 않음"
            exit 1
          fi

      - name: Also confirm request WITHOUT secret header is rejected (403)
        run: |
          http_code=$(curl -sS -o /tmp/resp2.txt -w "%{http_code}" -X POST \
            "https://issuejupjup.com/telegram-webhook.php" \
            -H "Content-Type: application/json" \
            -d '{"update_id": 2, "callback_query": {"id": "x", "data": "reject:X", "message": {"message_id": 1, "chat": {"id": 0}}}}')
          echo "HTTP status (no secret header, expect 403): $http_code"
          cat /tmp/resp2.txt
          echo
          if [ "$http_code" != "403" ]; then
            echo "시크릿 검증이 제대로 안 되고 있음 (보안 문제)"
            exit 1
          fi
