name: Test Telegram webhook endpoint (diagnostic)

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test whether Korean/emoji string literals survive FTP transfer
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          cat > /tmp/stage4.php <<'PHP'
          <?php
          $label = true ? '✅ 승인됨 (공개 전환)' : '❌ 거부됨 (영상 삭제됨)';
          echo "stage4 ok: " . $label;
          echo " | bytes: " . strlen($label);
          PHP
          wc -c /tmp/stage4.php
          php -l /tmp/stage4.php
          php /tmp/stage4.php
          echo
          python3 - <<'PYEOF'
          import ftplib, os
          ftp = ftplib.FTP()
          ftp.connect(os.environ["FTP_HOST"], 21, timeout=15)
          ftp.login(os.environ["FTP_USER"], os.environ["FTP_PASSWORD"])
          with open("/tmp/stage4.php", "rb") as f:
              ftp.storbinary("STOR stage4.php", f)
          print("uploaded stage4.php via storbinary (binary mode)")
          ftp.quit()
          PYEOF

      - name: Request stage4.php
        run: |
          curl -sS -m 10 -o - -w "\n[status=%{http_code}]\n" "http://issuejupjup.com/stage4.php"

      - name: Clean up
        if: always()
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PYEOF'
          import ftplib, os
          ftp = ftplib.FTP()
          ftp.connect(os.environ["FTP_HOST"], 21, timeout=15)
          ftp.login(os.environ["FTP_USER"], os.environ["FTP_PASSWORD"])
          try:
              ftp.delete("stage4.php")
              print("deleted stage4.php")
          except Exception as e:
              print(f"could not delete: {e}")
          ftp.quit()
          PYEOF
