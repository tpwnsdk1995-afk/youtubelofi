name: Test Telegram webhook endpoint (diagnostic)

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Compare our PHP vs a known WordPress PHP file (plain HTTP)
        run: |
          echo "--- our telegram-webhook.php (GET, no headers) ---"
          curl -sS -m 10 -o - -w "\n[status=%{http_code}]\n" "http://issuejupjup.com/telegram-webhook.php"
          echo
          echo "--- wp-login.php (should be a normal WP page if PHP execution generally works) ---"
          curl -sS -m 10 -o - -w "\n[status=%{http_code}]\n" "http://issuejupjup.com/wp-login.php" | head -c 500
          echo
          echo "--- a nonexistent .php file (expect a clean 404, to see what 'not found' looks like here) ---"
          curl -sS -m 10 -o - -w "\n[status=%{http_code}]\n" "http://issuejupjup.com/this-file-does-not-exist-xyz.php"
