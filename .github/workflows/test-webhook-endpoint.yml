name: Test Telegram webhook endpoint (diagnostic)

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret lengths and quote/newline presence (values never printed)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          DISPATCH_PAT: ${{ secrets.DISPATCH_PAT }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "TELEGRAM_BOT_TOKEN length: ${#TELEGRAM_BOT_TOKEN}"
          echo "TELEGRAM_WEBHOOK_SECRET length: ${#TELEGRAM_WEBHOOK_SECRET}"
          echo "DISPATCH_PAT length: ${#DISPATCH_PAT}"
          echo "FTP_HOST length: ${#FTP_HOST}"
          echo "FTP_USER length: ${#FTP_USER}"
          echo "FTP_PASSWORD length: ${#FTP_PASSWORD}"
          echo "--- does DISPATCH_PAT contain a single quote or newline? (booleans only, no value shown) ---"
          if [[ "$DISPATCH_PAT" == *"'"* ]]; then echo "contains single quote: YES"; else echo "contains single quote: NO"; fi
          if [[ "$DISPATCH_PAT" == *$'\n'* ]]; then echo "contains newline: YES"; else echo "contains newline: NO"; fi
          if [[ "$DISPATCH_PAT" == *'"'* ]]; then echo "contains double quote: YES"; else echo "contains double quote: NO"; fi
