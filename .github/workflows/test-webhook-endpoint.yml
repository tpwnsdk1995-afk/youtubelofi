name: Test Telegram webhook endpoint (diagnostic)

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Re-deploy via FTP-Deploy-Action then download it back and diff
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          DISPATCH_PAT: ${{ secrets.DISPATCH_PAT }}
          GH_OWNER: tpwnsdk1995-afk
          GH_REPO: youtubelofi
          GH_REF: claude/youtube-lofi-playlist-automation-959lx5
        run: |
          mkdir -p deploy
          envsubst '${TELEGRAM_BOT_TOKEN} ${TELEGRAM_WEBHOOK_SECRET} ${DISPATCH_PAT} ${GH_OWNER} ${GH_REPO} ${GH_REF}' \
            < webhook/telegram-webhook.php > deploy/webhook-check.php
          wc -c deploy/webhook-check.php
          md5sum deploy/webhook-check.php
          php -l deploy/webhook-check.php

      - name: Upload webhook-check.php via plain ftplib (binary) for comparison
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PYEOF'
          import ftplib, os
          ftp = ftplib.FTP()
          ftp.connect(os.environ["FTP_HOST"], 21, timeout=15)
          ftp.login(os.environ["FTP_USER"], os.environ["FTP_PASSWORD"])
          with open("deploy/webhook-check.php", "rb") as f:
              ftp.storbinary("STOR webhook-check.php", f)
          print("uploaded webhook-check.php via storbinary")
          ftp.quit()
          PYEOF

      - name: Request webhook-check.php (bare GET, should 403 if healthy)
        run: |
          curl -sS -m 10 -o - -w "\n[status=%{http_code}]\n" "http://issuejupjup.com/webhook-check.php"

      - name: Also re-download the ORIGINAL FTP-Deploy-Action-uploaded telegram-webhook.php and md5 it
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PYEOF'
          import ftplib, os
          ftp = ftplib.FTP()
          ftp.connect(os.environ["FTP_HOST"], 21, timeout=15)
          ftp.login(os.environ["FTP_USER"], os.environ["FTP_PASSWORD"])
          with open("/tmp/downloaded-original.php", "wb") as f:
              ftp.retrbinary("RETR telegram-webhook.php", f.write)
          ftp.quit()
          print("downloaded original telegram-webhook.php")
          PYEOF
          wc -c /tmp/downloaded-original.php
          md5sum /tmp/downloaded-original.php
          php -l /tmp/downloaded-original.php || true

      - name: Clean up
        if: always()
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PYEOF'
          import ftplib, os
          ftp = ftplib.FTP()
          ftp.connect(os.environ["FTP_HOST"], 21, timeout=15)
          ftp.login(os.environ["FTP_USER"], os.environ["FTP_PASSWORD"])
          try:
              ftp.delete("webhook-check.php")
              print("deleted webhook-check.php")
          except Exception as e:
              print(f"could not delete: {e}")
          ftp.quit()
          PYEOF
