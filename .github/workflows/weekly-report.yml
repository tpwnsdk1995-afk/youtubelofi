name: Weekly channel report

# 매주 월요일 아침(KST)에 발동하는 Claude Code Remote Routine이 workflow_dispatch로
# 담당한다. GitHub 자체 schedule 트리거는 publish-video/auto-publish에서 지연·누락이
# 반복돼 이미 제거한 전례가 있어(README 참고) 처음부터 schedule을 두지 않는다.
on:
  workflow_dispatch: {}
  # 보조 트리거. 주 트리거는 Routine이고, 이건 Routine이 한도초과 등으로
  # 깨어나지 못한 날을 메우기 위한 것이다. 월요일 09:40 KST (Routine의 09:00보다 40분 뒤)
  # 평소에는 guard가 즉시 건너뛰므로 아무 일도 하지 않는다.
  schedule:
    - cron: "40 0 * * 1"

concurrency:
  group: weekly-report
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  guard:
    # GitHub schedule을 보조 트리거로 두면 Routine과 같은 날 둘 다 실행될 수 있다.
    # 리포트를 하루에 두 번 돌리면 두 번째 실행이 방금 저장된 스냅샷과 비교하게 돼
    # "증가 0회"라는 잘못된 리포트가 텔레그램으로 나간다. 그래서 오늘 이미
    # 성공한 실행이 있으면 건너뛴다.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - id: check
        uses: actions/github-script@v7
        with:
          script: |
            const kstDate = (iso) =>
              new Date(new Date(iso).getTime() + 9 * 3600 * 1000)
                .toISOString().slice(0, 10);
            const today = kstDate(new Date().toISOString());

            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'weekly-report.yml',
              per_page: 20,
            });
            const doneToday = runs.data.workflow_runs.filter(
              (r) => r.id !== context.runId
                && r.conclusion === 'success'
                && kstDate(r.created_at) === today
            );

            if (doneToday.length > 0) {
              core.setOutput('skip', 'true');
              core.setOutput('reason',
                `오늘(${today} KST) 이미 발송됨: run #${doneToday[0].run_number}`);
              core.notice(`중복 발송 방지: run #${doneToday[0].run_number}`);
            } else {
              core.setOutput('skip', 'false');
              core.setOutput('reason', `오늘(${today} KST) 발송 기록 없음 - 진행`);
            }

      - name: Report guard decision
        run: |
          echo "skip=${{ steps.check.outputs.skip }} / ${{ steps.check.outputs.reason }}"
          echo "### 중복 발송 가드" >> $GITHUB_STEP_SUMMARY
          echo "- 판정: ${{ steps.check.outputs.skip == 'true' && '건너뜀' || '진행' }}" >> $GITHUB_STEP_SUMMARY
          echo "- 근거: ${{ steps.check.outputs.reason }}" >> $GITHUB_STEP_SUMMARY

  report:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # schedule로 여기까지 왔다 = 주 트리거(월요일 09:00 Routine)가 오늘 발송을 못 했고
      # 보조(09:40)가 떠맡았다는 뜻. 조용히 메우면 Routine 사망을 아무도 모르므로
      # (2026-08-29~31 실제 사례) 경고를 함께 보낸다. 경고 전송 실패가 리포트를
      # 막으면 안 되므로 curl 실패는 무시한다.
      - name: Warn Telegram that backup schedule took over
        if: github.event_name == 'schedule'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=⚠️ 주간 리포트가 보조 스케줄로 실행됩니다. 주 트리거(월요일 09:00 Claude Routine)가 돌지 않았다는 신호이니 Claude 세션/Routine 상태를 확인해 주세요. 리포트는 이 실행이 정상 발송합니다." || echo "텔레그램 경고 전송 실패 (리포트는 계속 진행)"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and send weekly report
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 음원 재고(무드별 곡 수)를 리포트에 포함하기 위한 읽기 전용 조회.
          # 없으면 해당 섹션만 생략되고 리포트는 정상 발송된다.
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_MUSIC_FOLDER_ID: ${{ secrets.GDRIVE_MUSIC_FOLDER_ID }}
        run: python3 scripts/weekly_report.py

      - name: Commit updated weekly snapshot
        if: success()
        run: |
          git config user.name "lofi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/weekly_stats.json
          git commit -m "Update weekly stats snapshot" || echo "no snapshot changes to commit"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly report workflow failed: ${new Date().toISOString().slice(0,10)}`,
              body: `주간 리포트 워크플로우 실행이 실패했습니다. 로그를 확인해 주세요: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ["automation-failure"],
            });
