name: Weekly channel report

# 매주 월요일 아침(KST)에 발동하는 Claude Code Remote Routine이 workflow_dispatch로
# 담당한다. GitHub 자체 schedule 트리거는 publish-video/auto-publish에서 지연·누락이
# 반복돼 이미 제거한 전례가 있어(README 참고) 처음부터 schedule을 두지 않는다.
on:
  workflow_dispatch: {}

concurrency:
  group: weekly-report
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and send weekly report
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/weekly_report.py

      - name: Commit updated weekly snapshot
        if: success()
        run: |
          git config user.name "lofi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/weekly_stats.json
          git commit -m "Update weekly stats snapshot" || echo "no snapshot changes to commit"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly report workflow failed: ${new Date().toISOString().slice(0,10)}`,
              body: `주간 리포트 워크플로우 실행이 실패했습니다. 로그를 확인해 주세요: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ["automation-failure"],
            });
