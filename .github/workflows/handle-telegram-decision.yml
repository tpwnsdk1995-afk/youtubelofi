name: Handle Telegram decision (real-time webhook)

# 카페24에 배포된 webhook/telegram-webhook.php가 텔레그램 버튼 클릭을 실시간으로 받아
# video_id/decision과 함께 이 워크플로우를 즉시 트리거한다. check-telegram-response.yml과
# 달리 텔레그램 폴링(getUpdates) 없이 이미 확정된 decision을 바로 반영한다 — approve면
# 공개 전환, reject면 영상 삭제, 어느 쪽이든 관련 pending-confirmation 이슈를 닫는다.
on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "영상 ID"
        required: true
        type: string
      decision:
        description: "승인/거부"
        required: true
        type: choice
        options:
          - approve
          - reject

permissions:
  issues: write

jobs:
  handle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Find matching pending confirmation issue
        id: find
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "pending-confirmation",
              per_page: 20,
            });
            const videoId = "${{ github.event.inputs.video_id }}";
            const issue = issues.data.find(i => i.title.includes(videoId));
            if (!issue) {
              core.setOutput("found", "false");
              return;
            }
            core.setOutput("found", "true");
            core.setOutput("issue_number", issue.number);

      - uses: actions/checkout@v4
        if: steps.find.outputs.found == 'true'

      - uses: actions/setup-python@v5
        if: steps.find.outputs.found == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.find.outputs.found == 'true'
        run: pip install google-api-python-client google-auth

      - name: Finalize publish (approved)
        if: steps.find.outputs.found == 'true' && github.event.inputs.decision == 'approve'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python3 scripts/finalize_publish.py "--video-id=${{ github.event.inputs.video_id }}" --privacy-status=public

      - name: Close issue (approved)
        if: steps.find.outputs.found == 'true' && github.event.inputs.decision == 'approve'
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = ${{ steps.find.outputs.issue_number }};
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: "텔레그램에서 승인되어 공개 전환되었습니다. (실시간 웹훅 처리)",
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              state: "closed",
            });

      - name: Delete video (rejected)
        if: steps.find.outputs.found == 'true' && github.event.inputs.decision == 'reject'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python3 scripts/delete_video.py "--video-id=${{ github.event.inputs.video_id }}"

      - name: Close issue (rejected)
        if: steps.find.outputs.found == 'true' && github.event.inputs.decision == 'reject'
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = ${{ steps.find.outputs.issue_number }};
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: "텔레그램에서 거부되어 영상이 유튜브에서 삭제되었습니다. (실시간 웹훅 처리)",
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              state: "closed",
              state_reason: "not_planned",
            });
